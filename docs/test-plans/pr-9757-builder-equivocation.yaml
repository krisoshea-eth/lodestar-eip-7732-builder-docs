# Local end-to-end test for PR #9757.
#
# Participant 1 runs the PR Lodestar BN and the Deathstar VC. The lifecycle-managed
# Buildoor instance is wired directly to participant 1. On each Deathstar proposer
# duty, the VC publishes the honest block and a second signature-valid block root.
# Once its lifecycle deposit is finalized, Buildoor bids on the honest block and
# submits its envelope with consensus_and_equivocation. The PR BN must reject it
# before gossip publication.

participants:
- el_type: geth
  el_image: ethpandaops/geth:glamsterdam-devnet-7
  cl_type: lodestar
  cl_image: local/lodestar:pr-9757
  vc_image: local/lodestar:deathstar-equivocation
  cl_log_level: debug
  vc_log_level: debug
  vc_extra_params:
  - --adversarial.equivocate.blockProposal=true
  - --graffiti=deathstar-equivocation
  supernode: true
  validator_count: 56

- el_type: geth
  el_image: ethpandaops/geth:glamsterdam-devnet-7
  cl_type: lodestar
  # Keep the observer on the same code/spec revision so it can validate the
  # PR node's post-builder-deposit states and remain peered through the test.
  cl_image: local/lodestar:pr-9757
  cl_log_level: debug
  vc_log_level: info
  supernode: true
  validator_count: 8

# The legacy single Buildoor mode is intentional here: it derives the builder key
# after all participant validators and always targets participant 1. Lifecycle
# registration takes roughly three minimal-preset epochs before bidding starts.
mev_type: buildoor
buildoor_params:
  image: ethpandaops/buildoor@sha256:501764a3c43e6289fa1b85df9e7489f1d2de24e1efe0a65c4d316bd340166991
  builder_api: true
  epbs_builder: true
  lifecycle: true
  extra_args:
  - --reveal-broadcast-validation=consensus_and_equivocation
  - --reveal-gate-mode=time
  - --reveal-time=2500
  - --reveal-max-attempts=1
  - --log-level=debug

network_params:
  preset: minimal
  seconds_per_slot: 6
  gloas_fork_epoch: 0
  attestation_due_bps_gloas: 2500
  withdrawal_type: "0x01"
  validator_balance: 32
  builder_count: 1
  builder_balance: 100
  deploy_eip8282_contracts: true

additional_services:
- dora
- prometheus

dora_params:
  image: ethpandaops/dora:glamsterdam-devnet-7

port_publisher:
  cl:
    enabled: true
    public_port_start: 37000
  additional_services:
    enabled: true

global_log_level: info
